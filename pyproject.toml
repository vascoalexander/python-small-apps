[project]
name = "python-small-apps"
version = "0.1.0"
description = ""
authors = [
    {name = "vascoalexander",email = "vascoalexander@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4"
dependencies = [
    "cffi>=1.17.0,<2.0.0",
    "charset-normalizer>=3.3.2,<4.0.0",
    "geographiclib>=2.0,<3.0",
    "geopy>=2.4.1,<3.0.0",
    "h3>=3.7.7,<4.0.0",
    "idna>=3.7,<4.0",
    "numpy>=2.1.0,<3.0.0",
    "pdf2image>=1.17.0,<2.0.0",
    "pillow>=10.4.0,<11.0.0",
    "pycparser>=2.22,<3.0",
    "pymupdf>=1.24.9,<2.0.0",
    "pymupdfb>=1.24.9,<2.0.0",
    "pypdf>=4.3.1,<5.0.0",
    "pypdf2>=3.0.1,<4.0.0",
    "requests>=2.32.3,<3.0.0",
    "setuptools>=73.0.1,<74.0.0",
    "timezonefinder>=6.5.2,<7.0.0",
    "ttkbootstrap>=1.10.1,<2.0.0",
    "tzdata>=2024.1,<2025.0",
    "urllib3>=2.2.2,<3.0.0",
    "ruff (>=0.11.10,<0.12.0)",
    "black (>=25.1.0,<26.0.0)",
    "isort (>=6.0.1,<7.0.0)",
    "pre-commit (>=4.2.0,<5.0.0)"
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py312"
lint.extend-select = ["I", "B", "C4", "UP", "SIM"]
exclude = [".venv", "build", "dist"]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
